; PlatformIO Project Configuration for ESP32-S3 N16R8 Smart Anthropometry Device
; Ankur / CGMS Hardware Firmware

[platformio]
default_envs = esp32-s3-devkitc-1-n16r8
src_dir = src
include_dir = include

[env:esp32-s3-devkitc-1-n16r8]
platform = espressif32 @ ^6.5.0
board = esp32-s3-devkitc-1
framework = arduino

; Target: ESP32-S3 N16R8 (16MB Flash, 8MB Octal PSRAM)
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_build.partitions = partitions_16MB_ota.csv

; Monitor & Upload options
monitor_speed = 115200
upload_speed = 921600

; Build flags for USB CDC, PSRAM, and NimBLE configuration
build_flags = 
    -D BOARD_HAS_PSRAM
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
    -D CONFIG_NIMBLE_CPP_LOG_LEVEL=2
    -D CORE_DEBUG_LEVEL=3

; Required Libraries
lib_deps =
    h2zero/NimBLE-Arduino @ ^1.4.1
    adafruit/Adafruit NeoPixel @ ^1.12.0
    adafruit/Adafruit SSD1306 @ ^2.5.9
    adafruit/Adafruit GFX Library @ ^1.11.9
    bogde/HX711 @ ^0.7.5
